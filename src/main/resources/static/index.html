<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProjectLogin - Interno</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 { margin-top: 0; color: #333; text-align: center; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #0056b3; }
        #mensaje {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Iniciar Sesión</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Usuario" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <button type="submit">Ingresar</button>
    </form>
    <p id="mensaje"></p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault(); // Evita que la página se recargue sola

        const usernameInput = document.getElementById('username').value;
        const passwordInput = document.getElementById('password').value;
        const mensajeTxt = document.getElementById('mensaje');

        try {
            // Le pegamos de forma relativa a nuestro propio backend de Spring Boot
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username: usernameInput, password: passwordInput })
            });

            const data = await response.text();

            if (response.ok) {
                mensajeTxt.style.color = "green";
                mensajeTxt.innerText = "✅ " + data;
            } else {
                mensajeTxt.style.color = "red";
                mensajeTxt.innerText = "❌ " + data;
            }
        } catch (error) {
            mensajeTxt.style.color = "red";
            mensajeTxt.innerText = "❌ Error de conexión con el servidor.";
        }
    });
</script>

</body>
</html>
